<style>
  .github-corner {
    display: block;
    position: absolute;
    top: 0;
    right: 0;
    border: 0;
    background: #400314;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    transition: background-color 500ms ease-out;
  }

  .github-corner:hover {
    background: #ff0d51;
  }

  .github-corner:hover .octo-arm {
    animation: octocat-wave 560ms 250ms ease-in-out;
  }

  @keyframes octocat-wave {
    0%, 100% {
      transform: rotate(0);
    }
    20%, 60% {
      transform: rotate(-25deg);
    }
    40%, 80% {
      transform: rotate(10deg);
    }
  }

  @media (max-width: 500px) {
    .github-corner:hover .octo-arm {
      animation: none;
    }

    .github-corner .octo-arm {
      animation: octocat-wave 560ms 250ms ease-in-out;
    }
  }
</style>
